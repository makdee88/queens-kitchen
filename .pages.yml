media:
  input: public/images/uploads
  output: /images/uploads

content:
  # 1. Upcoming Events & Pop-Ups
  - name: events
    label: Upcoming Events
    type: collection
    path: src/content/events
    view:
      fields: [title, event_date, location, active]
      primary: title
      sort: [event_date]
    fields:
      - name: title
        label: Event Title
        type: string
        required: true
      - name: event_date
        label: Event Date & Time
        type: date
        options:
          time: true
        required: true
      - name: location
        label: Venue / Location
        type: string
        required: true
      - name: banner
        label: Event Poster / Banner Image
        type: image
      - name: price_note
        label: Ticket or Plate Price Info (Optional)
        type: string
      - name: rsvp_link
        label: Facebook Event or RSVP Link (Optional)
        type: string
      - name: active
        label: Show on Website
        type: boolean
        default: true
      - name: body
        label: Event Description & Menu Highlights
        type: rich-text

  # 2. Catering Packages & Custom Menu Items
  - name: menu
    label: Menu & Combo Builder
    type: file
    path: src/data/menu.json
    fields:
      - name: currency
        label: Currency
        type: string
        default: SEK
      - name: min_guests
        label: Minimum Guests
        type: number
        default: 10
      - name: packages
        label: Base Combo Packages
        type: object
        list: true
        fields:
          - name: id
            label: Package ID (unique, lowercase, no spaces)
            type: string
            required: true
          - name: name
            label: Package Name (e.g., Maharaja Thali)
            type: string
            required: true
          - name: description
            label: Package Summary
            type: string
          - name: price_per_person
            label: Base Price Per Person
            type: number
            required: true
      - name: dishes
        label: Available Dishes
        type: object
        list: true
        fields:
          - name: name
            label: Dish Name
            type: string
            required: true
          - name: category
            label: Category
            type: select
            options:
              values:
                - Starters
                - Biryani & Polao
                - Chicken & Mutton
                - Bengali Fish
                - Vegetarian Mains
                - Sides & Breads
                - Bengali Desserts
            required: true
          - name: description
            label: Short Description
            type: string
          - name: extra_price
            label: Extra Price Per Person (0 if included in base)
            type: number
            default: 0
          - name: dietary
            label: Dietary Tags
            type: select
            options:
              multiple: true
              values:
                - Vegetarian
                - Vegan
                - Halal
                - Gluten-Free
                - Spicy
          - name: photo
            label: Dish Photo (Leave blank for default photo)
            type: image
          - name: available
            label: Available for Ordering
            type: boolean
            default: true

  # 3. Food & Event Gallery
  - name: gallery
    label: Food & Event Gallery
    type: file
    path: src/data/kitchen-gallery.json
    fields:
      - name: photos
        label: Gallery Photos
        type: object
        list: true
        fields:
          - name: image
            label: Photo
            type: image
            required: true
          - name: caption
            label: Dish or Event Caption
            type: string
            required: true
          - name: category
            label: Category
            type: select
            options:
              values:
                - Signature Dishes
                - Catering & Buffets
                - Pop-Up Events
                - Sweets & Desserts

  # 4. About Us Page
  - name: about
    label: About Us Page
    type: file
    path: src/data/about.json
    fields:
      - name: badge
        label: Top Small Label
        type: string
        default: Our Story
      - name: headline
        label: Main Headline
        type: string
        required: true
      - name: intro
        label: Intro Paragraph
        type: text
        required: true
      - name: story_title
        label: Story Section Heading
        type: string
        required: true
      - name: story_body
        label: Kitchen Story
        type: text
        required: true
      - name: standards_title
        label: Kitchen Standards Heading
        type: string
        default: Our Kitchen Standards
      - name: standards
        label: Kitchen Standards List
        type: object
        list: true
        fields:
          - name: title
            label: Highlight Title
            type: string
            required: true
          - name: description
            label: Short Description
            type: string
            required: true

  # 5. Kitchen Contact & Site Settings
  - name: settings
    label: Kitchen Contact & Hours
    type: file
    path: src/data/settings.json
    fields:
      - name: business_name
        label: Kitchen Name
        type: string
      - name: tagline
        label: Hero Tagline
        type: string
      - name: phone
        label: WhatsApp / Phone Number
        type: string
      - name: email
        label: Order Notification Email
        type: string
      - name: facebook_url
        label: Facebook Page URL
        type: string
      - name: address
        label: Pickup / Kitchen Area
        type: string
      - name: banner_notice
        label: Top Announcement Banner (leave blank to hide)
        type: string

  # 6. Manual Website Publish Trigger
  - name: publish
    label: Publish Website Updates
    type: file
    path: trigger-build.json
    fields:
      - name: last_published
        label: Last Published Date & Time
        type: date
        options:
          time: true
        required: true
      - name: release_note
        label: Update Note
        type: string
        default: Menu and event updates